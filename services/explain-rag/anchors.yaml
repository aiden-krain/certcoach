# Explain/RAG Service - Document Anchors Configuration
# Allowlist of official documentation domains and sources for citation

# Microsoft Fabric / Azure Documentation
microsoft_docs:
  - domain: "learn.microsoft.com"
    base_url: "https://learn.microsoft.com"
    license: "Microsoft Documentation License"
    description: "Official Microsoft Learn documentation"
    allowed_paths:
      - "/fabric/"
      - "/azure/data-factory/"
      - "/azure/synapse-analytics/"
      - "/azure/databricks/"
      - "/certifications/exams/dp-700"
    verification_keywords:
      - "Microsoft"
      - "Azure"
      - "Fabric"
      - "official"
    last_verified: "2024-12-01"
    check_frequency_days: 7

  - domain: "docs.microsoft.com"
    base_url: "https://docs.microsoft.com"
    license: "Microsoft Documentation License" 
    description: "Legacy Microsoft documentation (redirects to learn.microsoft.com)"
    allowed_paths:
      - "/azure/"
      - "/sql/"
    verification_keywords:
      - "Microsoft"
      - "Azure"
    last_verified: "2024-12-01"
    check_frequency_days: 14

